# Perfil del Banco A.
server:
  port: 8081

banco:
  id: BANCO_A
  nombre: Banco A
  prioridad: 1
  # Archivo externo (fuera del jar) donde este banco persiste sus cuentas.
  # Se puede sobreescribir con la variable de entorno BANCO_DATA_DIR (Docker).
  data-file: ${BANCO_DATA_DIR:./data}/cuentas-bancoA.json
  # Datos semilla del classpath, copiados a data-file la primera vez.
  seed-resource: data/cuentas-bancoA.json
  # Los otros dos bancos (peers). En local se usa localhost; en Docker, el nombre
  # del contenedor vía PEER_*_URL (ver docker-compose.yml).
  peers:
    - id: BANCO_B
      url: ${PEER_B_URL:http://localhost:8082}
    - id: BANCO_C
      url: ${PEER_C_URL:http://localhost:8083}
  replicacion:
    destino-peer-id: BANCO_B
    replicas-dir: ${BANCO_REPLICAS_DIR:./data/replicas}
