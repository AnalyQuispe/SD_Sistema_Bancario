# Configuración común a las 3 instancias (Banco A, B y C).
# Cada banco se diferencia activando su perfil: bancoA, bancoB o bancoC.
# Ejemplo: ./mvnw spring-boot:run -Dspring-boot.run.profiles=bancoA
spring:
  application:
    name: banco-service

# Secreto compartido entre los 3 bancos para las llamadas peer-a-peer (/internal/**).
# Aporte A (seguridad): sin esta cabecera un tercero recibe 403. En Docker se
# inyecta con la variable INTERNAL_TOKEN (misma para los 3 nodos).
banco:
  internal-token: ${INTERNAL_TOKEN:sd-bancos-2026-secreto-interno}
  # Motor de persistencia (configurable en aspectos de la base de datos):
  #   archivo -> JSON local (por defecto)   |   db -> base de datos SQLite embebida
  # Se puede sobreescribir con la variable de entorno BANCO_PERSISTENCIA (p. ej. en Docker).
  persistencia: ${BANCO_PERSISTENCIA:archivo}

# Endpoint de salud (usado por Docker para el healthcheck).
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.banco: INFO
