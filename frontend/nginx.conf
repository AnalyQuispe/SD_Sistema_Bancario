# Sirve la SPA de React. Toda la comunicación con el backend va del navegador
# al API Gateway (localhost:8080); nginx solo entrega los archivos estáticos.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta desconocida devuelve el index (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
